<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTHUR & CO. — Official Renewal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serifDisplay: ["Cormorant Garamond", "Georgia", "serif"],
            sansBody: ["Plus Jakarta Sans", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --arthur-bg-main: #6B2130;
      --arthur-bg-sub: #5A1B27;
      --arthur-text-primary: #F7F7F5;
      --arthur-border: rgba(247, 247, 245, 0.18);
    }

    /* Scoped Imweb isolation & full-bleed styling */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #6B2130 !important;
      color: #F7F7F5 !important;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .arthur-renewal-page {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F7F7F5 !important;
      background-color: #6B2130 !important;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 auto;
    }

    .arthur-renewal-page main {
      width: 100% !important;
      max-width: 1400px !important;
    }

    .arthur-renewal-page * {
      box-sizing: border-box;
    }

    /* Texture & Ambient Background */
    .arthur-renewal-bg-pattern {
      background-color: #6B2130 !important;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(125, 38, 56, 0.7) 0%, rgba(107, 33, 48, 0) 65%),
        radial-gradient(circle at 10% 80%, rgba(85, 23, 36, 0.6) 0%, rgba(107, 33, 48, 0) 50%),
        radial-gradient(circle at 90% 90%, rgba(135, 42, 60, 0.5) 0%, rgba(107, 33, 48, 0) 50%) !important;
    }

    /* Interactive Title Typography Effect */
    .arthur-renewal-title-hover {
      display: inline-block;
      transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1), letter-spacing 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arthur-renewal-title-container:hover .arthur-renewal-title-hover {
      transform: translateX(-6px);
      letter-spacing: -0.01em;
    }

    .arthur-renewal-title-sub-hover {
      display: inline-block;
      transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1), letter-spacing 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arthur-renewal-title-container:hover .arthur-renewal-title-sub-hover {
      transform: translateX(-4px);
      letter-spacing: 0.12em;
    }

    /* Reduced Motion Override */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  function getWordmarkStyle(name) {
    if (name.length > 11) {
      return "text-xs sm:text-base md:text-lg lg:text-xl tracking-[0.14em] sm:tracking-[0.18em]";
    } else if (name.length > 8) {
      return "text-sm sm:text-lg md:text-xl lg:text-2xl tracking-[0.18em] sm:tracking-[0.24em]";
    }
    return "text-base sm:text-xl md:text-2xl lg:text-3xl tracking-[0.22em] sm:tracking-[0.3em]";
  }

  function renderBrandGrid() {
    const container = document.getElementById("brand-grid-container");
    if (!container) return;

    container.innerHTML = BRAND_ASSETS.map((brand) => {
      const scaleVal = brand.scale || 1.0;
      const wordmarkClass = getWordmarkStyle(brand.name);
      
      const innerContent = `
        <div class="relative w-full h-full flex items-center justify-center p-2 sm:p-3">
          <div class="w-full h-full max-h-[82%] max-w-[88%] flex items-center justify-center transition-transform duration-500 group-hover:scale-[1.03]" style="transform: scale(${scaleVal});">
            <img 
              src="${brand.logo}" 
              alt="${brand.name} logo" 
              class="max-h-full max-w-full object-contain transition-all duration-500 opacity-90 group-hover:opacity-100"
            />
          </div>
        </div>
      `;

      return `
        <div class="arthur-renewal-brand-cell relative border-r border-b border-[#852D3F] h-28 sm:h-40 md:h-48 lg:h-60 xl:h-64 flex items-center justify-center p-2 sm:p-6 text-center group cursor-default transition-all duration-300 hover:bg-[#7D283A]/60">
          <div class="absolute top-2 right-2 sm:top-2.5 sm:right-2.5 w-1.5 h-1.5 rounded-full bg-[#F7F7F5]/0 group-hover:bg-[#F7F7F5]/40 transition-all duration-300" aria-hidden="true"></div>
          ${innerContent}
        </div>
      `;
    }).join("");
  }

  // Email Copy with Toast Notification
  document.addEventListener("DOMContentLoaded", () => {
    renderBrandGrid();

    const emailBtn = document.getElementById("email-copy-link");
    const toast = document.getElementById("copy-toast");

    if (emailBtn) {
      emailBtn.addEventListener("click", (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        const email = "cathy@arthurnco.com";
        
        function showToast() {
          if (toast) {
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 2500);
          }
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).then(showToast).catch(() => {
            fallbackCopy(email, showToast);
          });
        } else {
          fallbackCopy(email, showToast);
        }
      });
    }

    function fallbackCopy(text, cb) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand("copy");
        if (cb) cb();
      } catch (err) {}
      document.body.removeChild(textArea);
    }
  });
</script>

</body>
</html>
