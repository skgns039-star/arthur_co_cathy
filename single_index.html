<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTHUR & CO. — Official Renewal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serifDisplay: ["Cormorant Garamond", "Georgia", "serif"],
            sansBody: ["Plus Jakarta Sans", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --arthur-bg-main: #6B2130;
      --arthur-bg-sub: #5A1B27;
      --arthur-text-primary: #F7F7F5;
      --arthur-border: rgba(247, 247, 245, 0.18);
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #6B2130 !important;
      color: #F7F7F5 !important;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .arthur-renewal-page {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F7F7F5 !important;
      background-color: #6B2130 !important;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 auto;
    }

    .arthur-renewal-page main {
      width: 100% !important;
      max-width: 1400px !important;
    }

    .arthur-renewal-page * {
      box-sizing: border-box;
    }

    .arthur-renewal-bg-pattern {
      background-color: #6B2130 !important;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(125, 38, 56, 0.7) 0%, rgba(107, 33, 48, 0) 65%),
        radial-gradient(circle at 10% 80%, rgba(85, 23, 36, 0.6) 0%, rgba(107, 33, 48, 0) 50%),
        radial-gradient(circle at 90% 90%, rgba(135, 42, 60, 0.5) 0%, rgba(107, 33, 48, 0) 50%) !important;
    }

    .arthur-renewal-title-hover {
      display: inline-block;
      transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1), letter-spacing 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arthur-renewal-title-container:hover .arthur-renewal-title-hover {
      transform: translateX(-6px);
      letter-spacing: -0.01em;
    }

    .arthur-renewal-title-sub-hover {
      display: inline-block;
      transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1), letter-spacing 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arthur-renewal-title-container:hover .arthur-renewal-title-sub-hover {
      transform: translateX(-4px);
      letter-spacing: 0.12em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-[#6B2130] text-[#F7F7F5] selection:bg-[#852D3F] selection:text-white">

<section class="arthur-renewal-page relative w-full min-h-svh h-svh flex flex-col justify-between items-center overflow-x-hidden overflow-y-auto arthur-renewal-bg-pattern p-3 sm:p-5 md:p-6 select-none">
  
  <main class="w-full max-w-[1400px] my-auto flex flex-col items-center justify-center py-2 px-1 sm:px-4">
    
    <header class="arthur-renewal-logo-wrapper flex flex-col items-center justify-center pt-2 pb-1">
      <div class="relative flex items-center justify-center max-w-[480px] sm:max-w-[680px] md:max-w-[850px] lg:max-w-[1050px] h-36 sm:h-48 md:h-60 lg:h-72 px-2">
        <img 
          id="arthur-main-logo"
          src="https://skgns039-star.github.io/arthur_co_cathy/logos/arthur.png" 
          alt="ARTHUR & CO." 
          class="max-h-full w-auto object-contain transition-opacity duration-500 opacity-100"
          onerror="this.parentElement.innerHTML='<div class="text-center py-2"><span class="font-serifDisplay text-2xl sm:text-3xl md:text-4xl lg:text-5xl tracking-[0.28em] text-[#F7F7F5] font-medium uppercase block">ARTHUR & CO.</span><span class="text-[10px] sm:text-xs tracking-[0.3em] text-[#F7F7F5]/60 uppercase block mt-1">Group Archive</span></div>';"
        />
      </div>
    </header>

    <div class="arthur-renewal-title-container text-center my-3 sm:my-5 cursor-default">
      <h1 class="font-serifDisplay text-3xl sm:text-5xl md:text-6xl lg:text-7xl tracking-normal text-[#F7F7F5] font-normal leading-tight">
        <span class="arthur-renewal-title-hover">홈페이지 리뉴얼 중입니다</span>
      </h1>
      
      <p class="font-serifDisplay italic text-xs sm:text-base md:text-lg text-[#F7F7F5]/60 tracking-[0.1em] font-light mt-2.5 sm:mt-3.5">
        <span class="arthur-renewal-title-sub-hover">Our website is being renewed</span>
      </p>

      <div class="w-10 h-[1px] bg-[#F7F7F5]/25 mx-auto mt-4 sm:mt-5"></div>
    </div>

    <div class="arthur-renewal-brand-grid-wrapper w-full max-w-[1380px] mx-auto px-1 sm:px-2 my-4 sm:my-7">
      <div id="brand-grid" class="grid grid-cols-3 grid-rows-3 border-t border-l border-[#852D3F] shadow-lg bg-[#5A1B27]/40 backdrop-blur-[2px]">
      </div>
    </div>

  </main>

  <footer class="arthur-renewal-footer w-full text-center py-3 sm:py-4 mt-auto border-t border-[#852D3F]/40 flex flex-col items-center justify-center gap-1">
    <span class="text-[9px] sm:text-[11px] uppercase tracking-[0.35em] text-[#F7F7F5]/50 font-sansBody font-medium block">
      Inquiries & Contact
    </span>
    <button 
      id="contact-email-btn"
      onclick="copyContactEmail()"
      title="Click to copy email address"
      class="inline-flex items-center gap-2 font-sansBody font-semibold text-sm sm:text-lg text-[#F7F7F5] hover:text-white underline underline-offset-4 decoration-[#F7F7F5]/30 hover:decoration-[#F7F7F5] transition-all duration-300 px-3 py-1 rounded-md hover:bg-[#852D3F]/30 active:scale-[0.98]"
    >
      <span id="email-text">cathy@arthurnco.com</span>
    </button>
  </footer>

</section>

<script>
  const BRAND_ASSETS = [
    { name: "TOUS", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/tous.png", scale: 1.15 },
    { name: "PORSELLI", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/porselli.png", scale: 1.1 },
    { name: "DUCKFEET", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/duckfeet.png", scale: 0.95 },
    { name: "SPELTA MILANO", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/spelta.png", scale: 1.0 },
    { name: "DISNEY", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/disney.png", scale: 0.95 },
    { name: "COMPRESSPORT", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/compressport.png", scale: 1.0 },
    { name: "CELLVISION", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/cellvision.png", scale: 1.05 },
    { name: "VERUTUM", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/verutum.png", scale: 1.05 },
    { name: "NUTRICARE", logo: "https://skgns039-star.github.io/arthur_co_cathy/logos/nutricare.png", scale: 0.9 }
  ];

  function getWordmarkStyle(name) {
    if (name.length > 11) {
      return "text-xs sm:text-base md:text-lg lg:text-xl tracking-[0.14em] sm:tracking-[0.18em]";
    } else if (name.length > 8) {
      return "text-sm sm:text-lg md:text-xl lg:text-2xl tracking-[0.18em] sm:tracking-[0.24em]";
    }
    return "text-base sm:text-xl md:text-2xl lg:text-3xl tracking-[0.22em] sm:tracking-[0.3em]";
  }

  function renderBrandGrid() {
    const gridContainer = document.getElementById("brand-grid");
    if (!gridContainer) return;

    gridContainer.innerHTML = BRAND_ASSETS.map((brand) => {
      const wordmarkClass = getWordmarkStyle(brand.name);
      return "<div class="arthur-renewal-brand-cell relative border-r border-b border-[#852D3F] h-36 sm:h-48 md:h-56 lg:h-68 xl:h-72 flex items-center justify-center p-2 sm:p-6 text-center group cursor-default transition-all duration-300 hover:bg-[#7D283A]/60">" +
        "<div class="absolute top-2 right-2 sm:top-2.5 sm:right-2.5 w-1.5 h-1.5 rounded-full bg-[#F7F7F5]/0 group-hover:bg-[#F7F7F5]/40 transition-all duration-300" aria-hidden="true"></div>" +
        "<div class="relative w-full h-full flex items-center justify-center p-2 sm:p-3">" +
          "<div class="w-full h-full max-h-[82%] max-w-[88%] flex items-center justify-center transition-transform duration-500 group-hover:scale-[1.03]" style="transform: scale(" + (brand.scale || 1) + ");">" +
            "<img src="" + brand.logo + "" alt="" + brand.name + "" class="max-h-full max-w-full object-contain opacity-90 group-hover:opacity-100 transition-all duration-500" onerror="this.style.display='none'; this.parentElement.nextElementSibling.style.display='inline-block';" />" +
          "</div>" +
          "<span style="display:none;" class="font-serifDisplay font-medium text-[#F7F7F5]/85 group-hover:text-[#F7F7F5] uppercase whitespace-nowrap transition-transform duration-300 transform group-hover:-translate-y-0.5 " + wordmarkClass + "">" + brand.name + "</span>" +
        "</div>" +
      "</div>";
    }).join("");
  }

  function copyContactEmail() {
    const email = "cathy@arthurnco.com";
    navigator.clipboard.writeText(email).then(() => {
      const textSpan = document.getElementById("email-text");
      if (textSpan) {
        const originalText = textSpan.innerText;
        textSpan.innerText = "Copied to clipboard!";
        setTimeout(() => {
          textSpan.innerText = originalText;
        }, 2000);
      }
    }).catch(err => {
      console.error("Failed to copy email: ", err);
    });
  }

  document.addEventListener("DOMContentLoaded", renderBrandGrid);
</script>

</body>
</html>
