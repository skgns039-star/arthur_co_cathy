<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTHUR & CO. — Official Renewal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serifDisplay: ['Cormorant Garamond', 'Georgia', 'serif'],
            sansBody: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --arthur-bg-main: #ffffff;
      --arthur-bg-sub: #F3EFE7;
      --arthur-text-primary: #000000;
      --arthur-border: #ECE8E0;
    }

    /* Scoped Imweb isolation styles */
    .arthur-renewal-page {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--arthur-text-primary);
      background-color: var(--arthur-bg-main);
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      width: 100% !important;
      max-width: 100% !important;
    }

    .arthur-renewal-page main {
      width: 100% !important;
      max-width: 1400px !important;
    }

    .arthur-renewal-page * {
      box-sizing: border-box;
    }

    /* Texture & Ambient Background */
    .arthur-renewal-bg-pattern {
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(243, 239, 231, 0.85) 0%, rgba(255, 255, 255, 0) 65%),
        radial-gradient(circle at 10% 80%, rgba(243, 239, 231, 0.4) 0%, rgba(255, 255, 255, 0) 50%),
        radial-gradient(circle at 90% 90%, rgba(243, 239, 231, 0.3) 0%, rgba(255, 255, 255, 0) 50%);
    }

    /* Interactive Title Typography Effect */
    .arthur-renewal-title-hover {
      display: inline-block;
      transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1), letter-spacing 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arthur-renewal-title-container:hover .arthur-renewal-title-hover {
      transform: translateX(-6px);
      letter-spacing: -0.01em;
    }

    .arthur-renewal-title-sub-hover {
      display: inline-block;
      transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1), letter-spacing 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arthur-renewal-title-container:hover .arthur-renewal-title-sub-hover {
      transform: translateX(-4px);
      letter-spacing: 0.12em;
    }

    /* Reduced Motion Override */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="m-0 p-0 overflow-x-hidden">

<section class="arthur-renewal-page relative flex flex-col justify-between items-center arthur-renewal-bg-pattern p-4 sm:p-6 md:p-8 select-none">
  
  <!-- Subtle Background Lighting Vignette -->
  <div class="pointer-events-none fixed inset-0 bg-radial from-transparent via-transparent to-black/[0.02]" aria-hidden="true"></div>

  <!-- Main Content Area -->
  <main class="w-full max-w-[1400px] my-auto flex flex-col items-center justify-center py-4 px-1 sm:px-4">
    
    <!-- 1. ARTHUR & CO. Logo -->
    <div class="arthur-renewal-logo-wrapper flex flex-col items-center justify-center pt-2 pb-1">
      <div class="relative flex items-center justify-center max-w-[480px] sm:max-w-[680px] md:max-w-[850px] lg:max-w-[1050px] h-36 sm:h-48 md:h-60 lg:h-72 px-2">
        <img 
          id="arthur-main-logo"
          src="https://cdn.imweb.me/thumbnail/20260729/63c1d1e64ecf1.png" 
          alt="ARTHUR & CO." 
          class="max-h-full max-w-full object-contain"
          onerror="this.style.display='none'; document.getElementById('arthur-logo-fallback').style.display='block';"
        />
        <div id="arthur-logo-fallback" class="hidden text-center py-2">
          <span class="font-serifDisplay text-2xl sm:text-3xl md:text-4xl lg:text-5xl tracking-[0.28em] text-black font-medium uppercase block">
            ARTHUR & CO.
          </span>
          <span class="text-[10px] sm:text-xs tracking-[0.3em] text-black/40 uppercase block mt-1">
            Group Archive
          </span>
        </div>
      </div>
    </div>

    <!-- 2. Renewal Notice -->
    <div class="arthur-renewal-notice-container text-center my-3 sm:my-4 cursor-default select-none">
      <div class="arthur-renewal-title-container inline-block group px-4 py-2 rounded-sm">
        <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-light tracking-tight text-black mb-1.5 sm:mb-2 leading-snug">
          <span class="arthur-renewal-title-hover font-sansBody inline-block">
            홈페이지 리뉴얼 중입니다
          </span>
        </h1>
        <p class="text-sm sm:text-base md:text-lg lg:text-xl font-serifDisplay italic tracking-[0.16em] text-black/60 font-normal">
          <span class="arthur-renewal-title-sub-hover inline-block">
            Our website is being renewed
          </span>
        </p>
      </div>
      <div class="w-10 h-[1px] bg-[#D8D2C6]/60 mx-auto mt-3 sm:mt-4" aria-hidden="true"></div>
    </div>

    <!-- 3. Operating Brands 3x3 Grid -->
    <div class="arthur-renewal-brand-grid-wrapper w-full max-w-[1380px] mx-auto px-1 sm:px-2 my-4 sm:my-7">
      <div id="brand-grid-container" class="grid grid-cols-3 grid-rows-3 border-t border-l border-[#ECE8E0] shadow-sm bg-white/80 backdrop-blur-[2px]">
        <!-- Brand Cells rendered via JS below -->
      </div>
    </div>

  </main>

  <!-- 4. Contact Email Footer -->
  <footer class="arthur-renewal-footer text-center pt-3 sm:pt-4 pb-4 sm:pb-5 mt-auto relative">
    <div class="inline-flex flex-col items-center justify-center space-y-1.5 relative">
      <span class="text-[11px] sm:text-xs tracking-[0.2em] uppercase font-sansBody font-medium" style="color: #555555 !important;">
        Inquiries & Contact
      </span>

      <div class="relative inline-block">
        <button 
          type="button" 
          id="email-copy-link"
          aria-label="Copy inquiry email cathy@arthurnco.com"
          class="text-sm sm:text-base font-sansBody font-medium tracking-[0.08em] hover:opacity-80 transition-opacity duration-300 underline underline-offset-4 px-2.5 py-1 rounded-sm cursor-pointer border-0 bg-transparent"
          style="color: #111111 !important; text-decoration: underline !important; text-decoration-color: #111111 !important;"
        >
          cathy@arthurnco.com
        </button>

        <!-- Toast Notification -->
        <div id="copy-toast" class="hidden absolute left-1/2 -translate-x-1/2 -top-10 whitespace-nowrap bg-black text-white text-[11px] sm:text-xs tracking-wider px-3.5 py-1.5 rounded shadow-lg pointer-events-none flex items-center space-x-1.5 z-50 transition-all">
          <span class="text-emerald-400 font-bold">✓</span>
          <span>이메일 주소가 복사되었습니다</span>
        </div>
      </div>
    </div>
  </footer>

</section>

<!-- Embedded Script for Brand Assets & Copy Feature -->
<script>
  // 9 Operating Brands Data
  const BRAND_ASSETS = [
    { name: "TOUS", logo: "https://cdn.imweb.me/thumbnail/20260729/228d0cb58c77d.png", scale: 1.0 },
    { name: "PORSELLI", logo: "", scale: 1.0 },
    { name: "DUCKFEET", logo: "https://cdn.imweb.me/thumbnail/20260729/311ab9d782845.png", scale: 1.55 },
    { name: "SPELTA MILANO", logo: "", scale: 1.0 },
    { name: "DISNEY", logo: "", scale: 1.0 },
    { name: "COMPRESSPORT", logo: "https://cdn.imweb.me/thumbnail/20260729/3920b4765acf3.png", scale: 2.4 },
    { name: "CELLVISION", logo: "https://cdn.imweb.me/thumbnail/20260729/10ee4b70ea738.png", scale: 2.4 },
    { name: "VERUTUM", logo: "https://cdn.imweb.me/thumbnail/20260729/4724e4042b176.png", scale: 1.45 },
    { name: "NUTRICARE", logo: "", scale: 1.0 }
  ];

  function getWordmarkStyle(name) {
    if (name.length > 11) {
      return "text-xs sm:text-base md:text-lg lg:text-xl tracking-[0.14em] sm:tracking-[0.18em]";
    } else if (name.length > 8) {
      return "text-sm sm:text-lg md:text-xl lg:text-2xl tracking-[0.18em] sm:tracking-[0.24em]";
    }
    return "text-base sm:text-xl md:text-2xl lg:text-3xl tracking-[0.22em] sm:tracking-[0.3em]";
  }

  function renderBrandGrid() {
    const container = document.getElementById('brand-grid-container');
    if (!container) return;

    container.innerHTML = BRAND_ASSETS.map((brand, idx) => {
      const scaleVal = brand.scale || 1.0;
      const wordmarkClass = getWordmarkStyle(brand.name);
      
      let innerContent = '';
      if (brand.logo) {
        innerContent = `
          <div class="relative w-full h-full flex items-center justify-center p-2 sm:p-3">
            <div class="w-full h-full max-h-[86%] max-w-[90%] flex items-center justify-center overflow-hidden transition-transform duration-500 group-hover:scale-[1.04]" style="transform: scale(${scaleVal});">
              <img 
                src="${brand.logo}" 
                alt="${brand.name} logo" 
                class="max-h-full max-w-full object-contain grayscale group-hover:grayscale-0 transition-all duration-500 opacity-90 group-hover:opacity-100"
                onerror="this.parentElement.innerHTML=\`<span class='font-serifDisplay font-medium text-black/80 group-hover:text-black uppercase whitespace-nowrap ${wordmarkClass}'>${brand.name}</span>\`;"
              />
            </div>
          </div>
        `;
      } else {
        innerContent = `
          <span class="font-serifDisplay font-medium text-black/75 group-hover:text-black uppercase whitespace-nowrap transition-all duration-300 transform group-hover:-translate-y-0.5 ${wordmarkClass}">
            ${brand.name}
          </span>
        `;
      }

      return `
        <div class="arthur-renewal-brand-cell relative border-r border-b border-[#ECE8E0] h-28 sm:h-40 md:h-48 lg:h-60 xl:h-64 flex items-center justify-center p-2 sm:p-6 text-center group cursor-default transition-all duration-300 hover:bg-[#F3EFE7]/50">
          <div class="absolute top-2 right-2 sm:top-2.5 sm:right-2.5 w-1.5 h-1.5 rounded-full bg-black/0 group-hover:bg-black/30 transition-all duration-300" aria-hidden="true"></div>
          ${innerContent}
        </div>
      `;
    }).join('');
  }

  // Email Copy with Toast Notification
  document.addEventListener('DOMContentLoaded', () => {
    renderBrandGrid();

    const emailBtn = document.getElementById('email-copy-link');
    const toast = document.getElementById('copy-toast');

    if (emailBtn) {
      emailBtn.addEventListener('click', (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        const email = 'cathy@arthurnco.com';
        
        function showToast() {
          if (toast) {
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
          }
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).then(showToast).catch(() => {
            fallbackCopy(email, showToast);
          });
        } else {
          fallbackCopy(email, showToast);
        }
      });
    }

    function fallbackCopy(text, cb) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand("copy");
        if (cb) cb();
      } catch (err) {}
      document.body.removeChild(textArea);
    }
  });
</script>

</body>
</html>
